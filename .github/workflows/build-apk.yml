name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Permet de lancer manuellement depuis l'onglet Actions
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupère le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Java 17 (requis par AGP 8.x)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Rend gradlew exécutable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Cache Gradle pour accélérer les builds suivants
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Build le debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 6. Upload l'APK comme artifact téléchargeable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RusseFR-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 7. Affiche la taille de l'APK dans les logs
      - name: APK info
        run: |
          echo "✅ Build terminé"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
